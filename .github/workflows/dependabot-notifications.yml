name: Dependabot notifications

# Dependabot PRs that fail CI can't be auto-merged, so ask for a review.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  notify-on-failure:
    name: Request review on failure
    runs-on: ubuntu-latest
    if: github.event.workflow_run.actor.login == 'dependabot[bot]' && github.event.workflow_run.conclusion == 'failure'
    steps:
      - uses: dariacm/smart-dependabot-notifications@v1
        with:
          github-token: ${{ github.token }}
          reviewers: dariacm
